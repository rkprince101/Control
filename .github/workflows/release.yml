name: Release

# Builds signed APKs and drafts a GitHub release when a version tag is pushed:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
# The tag must match `version:` in pubspec.yaml (v1.0.0 for 1.0.0+1). Needs
# four repository secrets, described in README > Releasing: KEYSTORE_BASE64,
# KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true

      - name: Tag matches pubspec version
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $version"
            exit 1
          fi

      - run: flutter pub get

      - run: flutter analyze

      # Screenshot comparisons are rendered on Windows and differ by a few
      # pixels on Linux, so CI runs every test file without them.
      - name: Tests
        run: flutter test $(grep -L matchesGoldenFile test/*_test.dart)

      - name: Engine tests
        working-directory: packages/control_core
        run: |
          dart pub get
          dart test

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the signing secrets first (README > Releasing)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/control-release.jks
          {
            echo "storeFile=control-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Native tests
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Name the files
        run: |
          version=${GITHUB_REF_NAME#v}
          out=build/app/outputs/flutter-apk
          mkdir dist
          cp "$out/app-release.apk" "dist/Control-$version.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$out/app-$abi-release.apk" "dist/Control-$version-$abi.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          # Install steps first (Play Protect, restricted settings), then
          # GitHub's list of what changed.
          body_path: .github/release-notes.md
          generate_release_notes: true
          files: dist/*

      - name: Remove the key
        if: always()
        run: rm -f android/control-release.jks android/key.properties
